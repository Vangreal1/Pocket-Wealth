<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket-Wealth quote widget preview</title>
<style>
  body { margin:0; min-height:100vh; background:#0b1020; color:#f3f4f8; font:16px system-ui,sans-serif; padding:24px; }
  h1 { font-size:1.2rem; } p { color:#b7c2d7; } .grid { display:flex; flex-wrap:wrap; align-items:flex-start; gap:20px; }
  .desktop { width:min(380px,100%); } .phone { width:min(240px,100%); }
</style>
<h1>Pocket-Wealth — sample widget layouts</h1><p>DEMO DATA ONLY. No market connection or real prices in this preview.</p>
<div class="grid"><div class="desktop"><p>Desktop window</p><wealth-quote-widget symbol="DEMO"></wealth-quote-widget></div>
<div class="phone"><p>Phone home widget</p><wealth-quote-widget symbol="DEMO"></wealth-quote-widget></div></div>
<script type="module" src="./wealth-quote-widget.js"></script>
<script type="module">
  const widgets = document.querySelectorAll('wealth-quote-widget');
  let tick = 0;
  setInterval(() => {
    tick++;
    widgets.forEach(widget => widget.setQuote({type:'quote',symbol:'DEMO',price:100+Math.sin(tick/3)*2,
      previous_close:99,currency:'USD',as_of:new Date().toISOString(),feed_status:'demo',
      source_name:'Sample data',source_url:'https://example.org'}));
  },1000);
</script>
</html>
